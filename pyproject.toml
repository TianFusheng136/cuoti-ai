[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-error-review-workbench"
version = "0.1.0"
description = "本地运行的 AI 错题复盘工作台"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["education", "local-first", "fastapi", "react", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pillow>=12.3,<13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.11,<1.0",
  "pyinstaller>=6.12,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["backend/app/launcher.py"] # 由打包后的独立进程冒烟测试覆盖

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
